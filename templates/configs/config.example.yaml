# [[ when (modeIs "cli" "cli-library" "http") ]]
# Example YAML config. Load precedence when multiple sources enabled: YAML → ENV → flags.
[[ if modeIs "http" ]]
# `labels` keys must be valid Prometheus label names (legacy ASCII rules).
# See https://prometheus.io/docs/concepts/data_model/#metric-names-and-labels
[[ end ]]
labels:
  service: '[[ .ModuleBasename ]]'
  env: 'local'

http:
  listen_addr: ':8080'
[[ if modeIs "http" ]]

metrics:
  enabled: true
  listen_addr: ':9090'
  # Prometheus namespace; series look like `{prefix}_http_requests_total`.
  # Must be a legacy Prometheus metric name prefix (hyphens from the module basename become underscores).
  metric_prefix: '[[ .MetricPrefix ]]'
[[ end ]]
[[ if modeIs "cli" "cli-library" "http" ]]

logging:
  level: 'info'
  format: 'json'
  stream: 'stdout'
[[ end ]]
