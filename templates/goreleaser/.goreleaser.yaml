# GoReleaser: https://goreleaser.com/
# Run from repo root. Locally: goreleaser check --config goreleaser/.goreleaser.yaml
#
# CI sets: APP_BUILD_TIME, RELEASE_NAME, RELEASE_BODY, REGISTRY_IMAGE, PUSH_LATEST, GORELEASER_CURRENT_TAG
version: 2

project_name: [[ .ModuleBasename ]]

before:
  hooks:
    - go mod download

[[ if modeIs "cli" "cli-library" "http" ]]
builds:
  - id: [[ .Binary.Name ]]
    main: [[ .Binary.MainPackage ]]
    binary: [[ .Binary.Name ]]
    dir: .
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s
      - -w
      - -X [[ .Binary.VersionPackage ]].Version={{ .Tag }}
      - -X [[ .Binary.VersionPackage ]].Revision={{ .Commit }}
      - -X [[ .Binary.VersionPackage ]].BuildTime={{ .Env.APP_BUILD_TIME }}

archives:
  - id: [[ .Binary.Name ]]
    formats: [binary]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    ids:
      - [[ .Binary.Name ]]

checksum:
  name_template: checksums.txt

sboms:
  - id: [[ .Binary.Name ]]
    artifacts: binary
    ids:
      - [[ .Binary.Name ]]
    disable: false
[[ else if modeIs "library" ]]
builds:
  - id: noop
    skip: true
[[ end ]]

changelog:
  use: git
  sort: asc
  abbrev: 7
  filters:
    exclude:
      - "(?i)^merge "
      - "(?i)^merge pull request"
      - "^chore\\(release\\):"
      - "^ci:"
      - "^docs:"

[[ if modeIs "http" ]]
dockers_v2:
  - dockerfile: goreleaser/Dockerfile
    ids:
      - [[ .ServiceName ]]
    images:
      - "{{ .Env.REGISTRY_IMAGE }}"
    tags:
      - "{{ .Tag }}"
      - '{{ if eq .Env.PUSH_LATEST "true" }}latest{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64
    build_args:
      VERSION: "{{ .Tag }}"
      REVISION: "{{ .Commit }}"
      BUILD_TIME: "{{ .Env.APP_BUILD_TIME }}"
    disable: "{{ .IsSnapshot }}"
    sbom: true
[[ end ]]

release:
  prerelease: auto
  name_template: "{{ .Env.RELEASE_NAME }}"
  header: |
    {{ .Env.RELEASE_BODY }}

  footer: |
[[ if modeIs "cli" "cli-library" "http" ]]
    ## Downloads

    | Asset | Description |
    |-------|-------------|
    | `checksums.txt` | SHA256 checksums for all files in this release |
    | `[[ .ModuleBasename ]]_*` | Per-OS/arch binaries |
    | `*.sbom.json` | SPDX JSON SBOM per binary ([Syft](https://github.com/anchore/syft)) |

    Verify after download (Linux/macOS):

    ```bash
    sha256sum -c checksums.txt
    ```

    On Windows, verify the printed SHA256 against the file from `checksums.txt` using your preferred tool.

[[ end ]]
[[ if modeIs "http" ]]
    {{ if .Env.REGISTRY_IMAGE }}## Container image

    Multi-arch (`linux/amd64`, `linux/arm64`) OCI image on GHCR. The image build includes SBOM attestations (see BuildKit / `dockers_v2`).

    ```bash
    docker pull {{ .Env.REGISTRY_IMAGE }}:{{ .Tag }}
    ```
    {{ end }}
[[ end ]]
[[ if modeIs "library" "cli-library" ]]
    ## Use as a Go module

    ```bash
    go get [[ .ModulePath ]]@{{ .Tag }}
    ```

    Import from `[[ .ModulePath ]]/pkg/[[ .LibName ]]`.

[[ end ]]
[[ if modeIs "cli" "cli-library" ]]
    ## Install CLI

    As a Go tool:

    ```bash
    go get -tool [[ .ModulePath ]]/cmd/[[ .CliName ]]@{{ .Tag }}
    ```

    Or install globally:

    ```bash
    go install [[ .ModulePath ]]/cmd/[[ .CliName ]]@{{ .Tag }}
    ```

[[ end ]]
[[ if modeIs "cli" "cli-library" "http" ]]
    ## macOS Gatekeeper

    If macOS shows a Gatekeeper warning (“Apple could not verify…”):

    ```bash
    # Apple Silicon (arm64)
    xattr -d com.apple.quarantine [[ .ModuleBasename ]]-darwin-arm64

    # Intel (amd64)
    xattr -d com.apple.quarantine [[ .ModuleBasename ]]-darwin-amd64
    ```
[[ end ]]
