name: Template CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  bootstrap-unit:
    name: Bootstrap unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/bootstrap/go.mod
          cache-dependency-path: tools/bootstrap/go.sum

      - name: Test bootstrap module
        run: go -C tools/bootstrap test ./...

  bootstrap-matrix:
    name: Bootstrap smoke (${{ matrix.mode }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: cli
            names: -cli-name=smokecli
            build: "true"
          - mode: library
            names: -lib-name=smokelib
            build: "false"
          - mode: cli-library
            names: -cli-name=smokecli -lib-name=smokelib
            build: "true"
          - mode: http
            names: -service-name=smokeapp
            build: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/bootstrap/go.mod
          cache-dependency-path: tools/bootstrap/go.sum

      - name: Smoke bootstrap → test/build
        env:
          MODE: ${{ matrix.mode }}
          MATRIX_NAMES: ${{ matrix.names }}
          MATRIX_BUILD: ${{ matrix.build }}
          MODULE_PATH: example.com/smoke/${{ matrix.mode }}
        run: |
          set -euo pipefail
          SMOKE_DIR=$(mktemp -d)
          trap 'rm -rf "$SMOKE_DIR"' EXIT
          rsync -a --exclude '.git' --exclude '.bootstrap-out' ./ "$SMOKE_DIR/"
          cd "$SMOKE_DIR"
          # shellcheck disable=SC2086
          ./bootstrap.sh \
            -noninteractive \
            -mode="$MODE" \
            -module-path="$MODULE_PATH" \
            $MATRIX_NAMES
          # Exercise the Make targets, not just go test: SOURCE_CODE is itself
          # mode-dependent, so a missing tree only shows up through make.
          make test
          if [ "$MATRIX_BUILD" = "true" ]; then
            make build
          fi
          test -z "$(gofmt -l .)" || { echo "::error::rendered tree is not gofmt-clean"; gofmt -l .; exit 1; }

      - name: Assert per-mode surface
        env:
          MODE: ${{ matrix.mode }}
          MATRIX_NAMES: ${{ matrix.names }}
          MODULE_PATH: example.com/smoke/${{ matrix.mode }}
        run: |
          set -euo pipefail
          OUT_DIR=$(mktemp -d)
          trap 'rm -rf "$OUT_DIR"' EXIT
          rsync -a --exclude '.git' --exclude '.bootstrap-out' ./ "$OUT_DIR/"
          cd "$OUT_DIR"
          # shellcheck disable=SC2086
          ./bootstrap.sh -noninteractive -no-swap \
            -mode="$MODE" -module-path="$MODULE_PATH" $MATRIX_NAMES
          cd .bootstrap-out

          # The domain is the constant every mode adapts to.
          test -f internal/domain/echo/service.go \
            || { echo "::error::$MODE mode missing the shared domain model"; exit 1; }
          test -f test/unit/domain/echo/service_test.go \
            || { echo "::error::$MODE mode missing the domain tests"; exit 1; }

          # Cheap backstop beside the golden manifests in tools/bootstrap:
          # HTTP-only surface must never leak into a mode with no server.
          if [ "$MODE" = "http" ]; then
            grep -rq 'request_id' internal/ || { echo "::error::http mode missing correlation id plumbing"; exit 1; }
            test -f internal/config/http.go || { echo "::error::http mode missing internal/config/http.go"; exit 1; }
            grep -rq 'http_requests_in_flight' internal/observability/metrics/ \
              || { echo "::error::http mode missing default metric set"; exit 1; }
          else
            if [ -e internal/config/http.go ] || [ -e internal/app ] || [ -e internal/transport ]; then
              echo "::error::$MODE mode rendered HTTP-only files"; exit 1
            fi
            if [ -d configs ] && grep -rq 'listen_addr' configs/; then
              echo "::error::$MODE mode leaks listen_addr into config"; exit 1
            fi
          fi
